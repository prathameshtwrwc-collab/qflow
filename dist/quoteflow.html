          notes: '', status: !dispatched ? 'draft' : (o.status === 'completed' || rnd() > .4 ? 'delivered' : 'dispatched') };
        S.challans.push(ch); dc++;
        logAudit('challan', ch.id, 'Delivery challan created', `For ${o.no}`);
      }

      if (rnd() < 0.9) {
        let idate = addDays(od, ri(0, 5)); if (idate > TODAY) idate = new Date(TODAY);
        const days = termDays(q.termsCode) || 15; const due = addDays(idate, days);
        let st = due < TODAY ? wpick([['paid', 7], ['overdue', 2], ['partially-paid', 1]]) : wpick([['sent', 4], ['paid', 2], ['draft', 1], ['partially-paid', 1]]);
        const iv = { id: 'inv' + inv, no: 'INV-' + inv, qid: q.id, oid: o.id, cid: q.cid, amount: q.total, paid: 0,
          date: iso(idate), due: iso(due), termsCode: q.termsCode, termsDays: days, po: q.po, jobNo: q.jobNo,
          advance: q.advance || 0, attachments: [], status: st };
        S.invoices.push(iv);
        logAudit('invoice', iv.id, 'Invoice created', `From ${q.no}`);
        if (st !== 'draft') logAudit('invoice', iv.id, 'Invoice sent', 'Emailed to ' + cust(q.cid).email);
        // payments
        const payTotal = st === 'paid' ? q.total : st === 'partially-paid' ? Math.round(q.total * pick([.3, .4, .5, .6])) : 0;
        if (payTotal > 0) {
          const parts = st === 'paid' && rnd() > .5 ? 2 : 1;
          let left = payTotal;
          for (let k = 0; k < parts; k++) {
            const amt = k === parts - 1 ? left : Math.round(payTotal / 2);
            left -= amt;
            const pd = addDays(idate, ri(2, Math.max(3, days + 10))); const pdate = pd > TODAY ? addDays(TODAY, -ri(0, 30)) : pd;
            const method = pick(PAY_METHODS.slice(0, 6));
            const pay = { id: 'pay' + (S.payments.length + 1), no: 'PAY-' + String(S.payments.length + 1).padStart(4, '0'),
              invId: iv.id, cid: q.cid, amount: amt, date: iso(pdate), method,
              ref: method === 'Cheque' ? '' : method + String(ri(100000, 999999)),
              cheque: method === 'Cheque' ? String(ri(100000, 999999)) : '', bank: method === 'Cheque' || method.includes('Bank') ? pick(['HDFC Bank', 'ICICI Bank', 'Axis Bank', 'SBI']) : '',
              notes: '', by: 'Aarav Mehta', ts: +pdate };
            S.payments.push(pay);
            const rc = { id: 'rc' + rcpt, no: 'RCPT-' + String(rcpt).padStart(4, '0'), payId: pay.id, invId: iv.id, cid: q.cid, amount: amt, date: pay.date, method, ref: pay.ref };
            S.receipts.push(rc); pay.rcpt = rc.no; rcpt++;
            logAudit('invoice', iv.id, `Payment ${money(amt)} recorded`, `${method}${pay.ref ? ' · ' + pay.ref : ''}`);
          }
          iv.paid = payTotal;
        }
        q.invoiced = iv.id;
        inv++;
      }
    }
  }
  // credit & debit notes against a few invoices
  const cnPool = S.invoices.filter(i => i.status === 'paid' || i.status === 'partially-paid');
  let cnN = 1, dnN = 1;
  cnPool.filter(() => rnd() < 0.06).slice(0, 9).forEach(iv => {
    const taxable = Math.round(iv.amount * pick([.03, .05, .08, .12]) / 118 * 100);
    S.cnotes.push({ id: 'cn' + cnN, no: 'CN-' + cnN, invId: iv.id, cid: iv.cid, date: iso(addDays(parse(iv.date), ri(3, 40)) > TODAY ? TODAY : addDays(parse(iv.date), ri(3, 40))),

  cnPool.filter(() => rnd() < 0.02).slice(0, 4).forEach(iv => {
    const taxable = Math.round(iv.amount * pick([.02, .04]) / 118 * 100);
    S.dnotes.push({ id: 'dn' + dnN, no: 'DN-' + dnN, invId: iv.id, cid: iv.cid, date: iso(addDays(parse(iv.date), ri(5, 30)) > TODAY ? TODAY : addDays(parse(iv.date), ri(5, 30))),
      reason: pick(['Additional site work', 'Extra material issued', 'Freight recovery']), qty: '', taxable, rate: 18,

  S.settings.cnNext = cnN; S.settings.dnNext = dnN;
  S.settings.dcNext = dc; S.settings.rcptNext = rcpt; S.settings.ordNext = ord;
  S.settings.invNext = inv;
  // follow-ups
  const fuTypes = ['Call', 'Email', 'WhatsApp', 'Meeting', 'Site visit'];
  const open = S.quotes.filter(q => ['sent', 'viewed'].includes(q.status)).slice(-60);
  open.forEach((q, i) => {

    S.followups.push({ id: uid('f'), cid: q.cid, qid: q.id, type: pick(fuTypes), due: iso(addDays(TODAY, off)), sp: q.sp, status: off < -3 && rnd() > .6 ? 'done' : 'pending', note: pick([`Check if ${c.name.split(' ')[0]} has reviewed the revised layout`, 'Confirm budget approval from finance', 'Share material samples and finish options', 'Discuss payment milestones', 'Walk through the 3D renders on a call', 'Follow up on the site-visit date']), created: Date.now() - ri(1, 20) * DAY });

  const recent = S.quotes.slice(-70);

  });
  const fresh = S.customers.filter(c => !S.quotes.some(q => q.cid === c.id)).slice(0, 16);

  S.notifications = [
    ...acc.map((q, i) => ({ id: uid('nt'), kind: 'accepted', qid: q.id, text: `${cust(q.cid).company} accepted ${q.no}`, ts: Date.now() - (i + 1) * 3.2 * 3600000, read: false })),

  ];
}

    if (rnd() > .5) L.push({ ch: 'whatsapp', ev: 'WhatsApp share initiated', ts: q.sentAt + 600000, to: c.phone, status: 'shared', msg: `Quotation ${q.no} · ${money(q.total)}` });
  }

  if (q.viewedAt && (q.status === 'viewed' || q.status === 'expired') && rnd() > .4) L.push({ ch: 'email', ev: 'Reminder sent', ts: q.viewedAt + 3 * DAY, to: c.email, status: 'delivered', msg: 'Gentle reminder about the quotation shared last week.' });
  if (q.status === 'accepted') L.push({ ch: 'portal', ev: 'Customer accepted quotation', ts: q.respondedAt, to: c.name, status: 'accepted' });
  if (q.status === 'rejected') L.push({ ch: 'portal', ev: 'Customer rejected quotation', ts: q.respondedAt, to: c.name, status: 'rejected', msg: q.reason });

/* ================= calculations ================= */
/* ---------- item columns (customisable per quotation) ----------
   name, price (rate) and amount are needed for the maths: they can be renamed but not removed.
   Built-ins can be hidden; custom columns can be added (text or number) and deleted.
   A custom number column marked `mult` multiplies into the line amount, like quantity. */
const BASE_COLS = [
  { key: 'name', label: 'Item', type: 'text', lock: true },
  { key: 'qty', label: 'Qty', type: 'number' },
  { key: 'unit', label: 'Unit', type: 'unit' },
  { key: 'price', label: 'Rate', type: 'number', lock: true },
  { key: 'disc', label: 'Disc %', type: 'number' },
  { key: 'tax', label: 'Tax', type: 'tax' },
  { key: 'desc', label: 'Description', type: 'text' },
  { key: 'sku', label: 'SKU / code', type: 'text' },
  { key: 'hsn', label: 'HSN / SAC', type: 'text' },
  { key: 'amount', label: 'Amount', type: 'number', lock: true },
];
const defaultCols = () => BASE_COLS.map(c => ({ ...c, on: true }));
const BASE_ON = defaultCols();
/* quotes without their own layout use the built-in default, so changing the workspace default never rewrites old quotations */
function qCols(q) { return (q && q.cols) || BASE_ON; }
const workspaceCols = () => JSON.parse(JSON.stringify(S.settings.itemCols || BASE_ON));
const colOn = (cols, k) => cols.some(c => c.key === k && c.on);
const colLabel = (cols, k) => (cols.find(c => c.key === k) || BASE_COLS.find(c => c.key === k) || {}).label;
function qFlatTax(q) { return q && q.flatTax != null ? +q.flatTax : +S.settings.defaultTax; }

function calcQuote(q) {
  let sub = 0, idisc = 0, tax = 0; const lines = [];
  const taxable = [];
  const cols = qCols(q), on = k => colOn(cols, k);
  const mults = cols.filter(c => c.custom && c.on && c.type === 'number' && c.mult);
  const flat = qFlatTax(q);
  for (const it of q.items) {
    if (it.type === 'section') { lines.push({ ...it }); continue; }
    const qty = on('qty') ? (+it.qty || 0) : 1;
    let mult = 1; for (const c of mults) { const v = it.cf?.[c.key]; mult *= (v === '' || v == null) ? 1 : (+v || 0); }
    const disc = on('disc') ? (+it.disc || 0) : 0;
    const rate = on('tax') ? (+it.tax || 0) : flat;
    const gross = qty * (+it.price || 0) * mult;
    const d = gross * (disc / 100);
    const net = gross - d;
    sub += gross; idisc += d;
    taxable.push({ net, rate });
    lines.push({ ...it, qty, disc, tax: rate, mult, gross, d, net, taxAmt: net * rate / 100, total: net + net * rate / 100 });
  }
  const netSum = sub - idisc;
  const od = q.odiscType === 'flat' ? Math.min(+q.odisc || 0, netSum) : netSum * ((+q.odisc || 0) / 100);
  const ratio = netSum ? (netSum - od) / netSum : 0;
  const taxBreak = {};
  for (const t of taxable) { const a = t.net * ratio * t.rate / 100; tax += a; taxBreak[t.rate] = (taxBreak[t.rate] || 0) + a; }
  const ship = +q.ship || 0, extra = +q.extra || 0;
  const chargesTax = (ship + extra) * 0.18;
  tax += chargesTax; if (ship + extra) taxBreak[18] = (taxBreak[18] || 0) + chargesTax;
  const cessRate = +q.cess || 0;
  const taxableVal = netSum - od + ship + extra;
  const cess = taxableVal * cessRate / 100;
  tax += cess;
  let grand = taxableVal + tax;
  // inter-state supply is IGST; within the business's own state it splits into CGST + SGST
  const c = cust(q.cid);
  const interState = !!(c && c.state && S.settings.state && c.state !== S.settings.state);
  const roundOn = q.roundOff != null ? q.roundOff : S.settings.roundOff;
  const rounded = roundOn ? Math.round(grand) : Math.round(grand * 100) / 100;
  const roundDiff = Math.round((rounded - grand) * 100) / 100;
  grand = rounded;
  const adv = grand * ((+q.advance || 0) / 100);
  const tds = q.tds && q.tds.on ? Math.round(taxableVal * (+q.tds.rate || 0)) / 100 * 100 / 100 : 0;
  const tdsAmt = q.tds && q.tds.on ? Math.round(taxableVal * (+q.tds.rate || 0)) / 100 : 0;
  return { lines, sub, idisc, od, taxable: taxableVal, tax, taxBreak, ship, extra, cess, cessRate,
           interState, cgst: interState ? 0 : (tax - cess) / 2, sgst: interState ? 0 : (tax - cess) / 2, igst: interState ? tax - cess : 0,
           roundDiff, grand, adv, tdsAmt, netReceivable: Math.round((grand - tdsAmt) * 100) / 100 };
}

const cust = id => S.customers.find(c => c.id === id);
const quote = id => S.quotes.find(q => q.id === id);
const prod = id => S.products.find(p => p.id === id);
const qOf = cid => S.quotes.filter(q => q.cid === cid);

function refreshExpiry() {
  for (const q of S.quotes) if ((q.status === 'sent' || q.status === 'viewed') && parse(q.expiry) < TODAY) { q.status = 'expired'; }
}

function custStats(cid) {
  const qs = qOf(cid);
  const acc = qs.filter(q => q.status === 'accepted'), rej = qs.filter(q => q.status === 'rejected');
  const pen = qs.filter(q => ['sent', 'viewed'].includes(q.status)), exp = qs.filter(q => q.status === 'expired');
  const decided = acc.length + rej.length;
  const total = qs.reduce((s, q) => s + q.total, 0), accV = acc.reduce((s, q) => s + q.total, 0);
  const last = qs.reduce((m, q) => q.date > m ? q.date : m, '');
  return { qs, n: qs.length, acc: acc.length, rej: rej.length, pen: pen.length, exp: exp.length, drafts: qs.filter(q => q.status === 'draft').length, total, accV, conv: decided ? pct(acc.length, decided) : 0, last, avg: qs.length ? total / qs.length : 0 };
}
function custSegment(c, st) {
  const tags = [];
  const ageDays = daysBetween(c.since, iso(TODAY));
  if (ageDays <= 90) tags.push('new');
  if (st.n >= 2) tags.push('returning');
  if (st.accV >= 700000) tags.push('high');
  if (st.pen) tags.push('pending');
  if (st.rej) tags.push('rejected');
  if (st.exp) tags.push('expired');
  if (!st.n) tags.push('inactive');
  const fu = S.followups.some(f => f.cid === c.id && f.status === 'pending');
  if (fu || st.pen && st.qs.some(q => q.status === 'viewed')) tags.push('followup');
  return tags;
}
function custStatus(st, c) {
  if (!st.n) return ['inactive', 'No activity'];
  if (st.acc && st.n >= 2) return ['returning', 'Returning'];
  if (st.acc) return ['active', 'Customer'];
  if (st.pen) return ['pending', 'Awaiting'];
  if (daysBetween(c.since, iso(TODAY)) <= 90) return ['new', 'New'];
  return ['lost', 'At risk'];
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  // close floating menus when clicking elsewhere
  if (!e.target.closest('.menu-wrap') && !e.target.closest('.gsearch')) closeFloating();
  if (!el) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && IN[el.dataset.ch]) IN[el.dataset.ch](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.scrim')) closeModal(); closeFloating(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { const g = $('#gs-input'); if (g) { e.preventDefault(); g.focus(); } }
});

function closeFloating() {
  let changed = false;
  for (const k of ['notifOpen', 'wsOpen', 'userOpen']) if (UI[k]) { UI[k] = false; changed = true; }
  if (UI.menu) { UI.menu = null; $$('.menu.row-menu').forEach(m => m.remove()); }
  if (changed) renderTopbar();
  const sr = $('.sresults'); if (sr && !document.activeElement?.closest?.('.gsearch')) sr.remove();
}

/* ================= toast ================= */
function toast(msg, sub = '', kind = 'ok') {
  let box = $('.toasts'); if (!box) { box = document.createElement('div'); box.className = 'toasts'; box.setAttribute('role', 'status'); document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + kind;
  t.innerHTML = `${I(kind === 'ok' ? 'checkc' : kind === 'warn' ? 'info' : 'alert')}<div><b style="font-weight:500">${esc(msg)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, 3600);
}

/* ================= modal ================= */
let modalCleanup = null;
function openModal(html, cls = '', onMount) {
  closeModal(true);
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('mousedown', e => { if (e.target === s) closeModal(); });
  document.body.appendChild(s);
  const f = s.querySelector('[autofocus]') || s.querySelector('input,select,textarea,button');
  setTimeout(() => f && f.focus(), 30);
  if (onMount) onMount(s);
}
function closeModal(silent) { const s = $('.scrim'); if (s) s.remove(); if (modalCleanup && !silent) { const f = modalCleanup; modalCleanup = null; f(); } }
A.closeModal = () => closeModal();
const mHead = (title, sub = '') => `<div class="mh"><div style="flex:1;min-width:0"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button class="btn icon ghost sm" data-a="closeModal" aria-label="Close">${I('x')}</button></div>`;

function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mkChart(id, cfg) {
  const cv = document.getElementById(id); if (!cv) return null;
  if (!window.Chart) { cv.insertAdjacentHTML('afterend', `<div class="chart-fallback">Chart unavailable offline</div>`); return null; }
  const ink2 = cssv('--muted'), line = cssv('--line');
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = ink2;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: { duration: 500 }, plugins: {} }, cfg.options || {});
  cfg.options.plugins = Object.assign({ legend: { display: false }, tooltip: { backgroundColor: cssv('--ink'), titleColor: cssv('--bg'), bodyColor: cssv('--bg'), padding: 10, cornerRadius: 6, boxPadding: 4, usePointStyle: true } }, cfg.options.plugins);
  if (cfg.type === 'bar' || cfg.type === 'line') {
    cfg.options.scales = cfg.options.scales || {};
    for (const ax of ['x', 'y']) {
      cfg.options.scales[ax] = Object.assign({ grid: { color: ax === 'y' ? line : 'transparent', drawTicks: false }, border: { display: false }, ticks: { padding: 6 } }, cfg.options.scales[ax] || {});
    }
  }
  const c = new Chart(cv, cfg); UI.charts.push(c); return c;
}

window.addEventListener('hashchange', route);
let CURRENT = '';
function route() {
  const h = location.hash || '#/';
  destroyCharts(); closeModal(true);
  for (const [re, fn, key] of ROUTES) {
    const m = h.match(re);
    if (m) {
      if (!key) return fn(m);
      const prevKey = CURRENT; CURRENT = key;
      if (key === 'landing' || key === 'portal') { document.body.innerHTML = ''; mountRoot(); fn(m); window.scrollTo(0, 0); return; }
      ensureShell(); setNav(key);
      const out = fn(m);
      const pg = $('#page');
      pg.innerHTML = `<div class="page">${out.html}</div>`;
      if (out.after) out.after();
      if (prevKey !== key || !out.keepScroll) window.scrollTo(0, 0);
      $('.app')?.classList.toggle('drawer', UI.drawer);
      document.title = (out.title ? out.title + ' · ' : '') + 'QuoteFlow';
      return;
    }
  }
  go('#/');
}
function rerender() { const y = window.scrollY; const h = location.hash; const out = ROUTES.find(r => h.match(r[0])); if (!out) return; destroyCharts(); const m = h.match(out[0]); const res = out[1](m); if (out[2] === 'landing' || out[2] === 'portal') return; $('#page').innerHTML = `<div class="page" style="animation:none">${res.html}</div>`; res.after && res.after(); setNav(out[2]); window.scrollTo(0, y); }

/* ================= shared components ================= */
function trendEl(cur, prev, invert = false) {
  if (!prev && !cur) return `<span class="trend flat">0%</span>`;
  const d = prev ? ((cur - prev) / prev) * 100 : 100;
  const up = d >= 0; const good = invert ? !up : up;
  if (Math.abs(d) < 0.5) return `<span class="trend flat">±0%</span>`;
  return `<span class="trend ${good ? 'up' : 'down'}">${I(up ? 'up' : 'down')}${Math.abs(d).toFixed(1)}%</span>`;
}
function pager(key, total, per) {
  const st = QS[key]; const pages = Math.max(1, Math.ceil(total / per)); const p = Math.min(st.page, pages);
  return `<div class="pager"><span>${total ? `${(p - 1) * per + 1}–${Math.min(p * per, total)} of ${numF(total)}` : 'No results'}</span><span class="spacer"></span>
    <select class="select" style="width:auto;height:30px" data-ch="perPage" data-key="${key}" aria-label="Rows per page">${[10, 25, 50].map(n => `<option ${n === per ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <button class="btn sm icon" data-a="page" data-key="${key}" data-d="-1" ${p <= 1 ? 'disabled' : ''} aria-label="Previous page">${I('left', 'sm')}</button>
    <span class="num">${p} / ${pages}</span>
    <button class="btn sm icon" data-a="page" data-key="${key}" data-d="1" ${p >= pages ? 'disabled' : ''} aria-label="Next page">${I('right', 'sm')}</button></div>`;
}

IN.perPage = el => { QS[el.dataset.key].per = +el.value; QS[el.dataset.key].page = 1; rerender(); };

function tlIcon(ch, ev = '') {
  const e = ev.toLowerCase();
  if (e.includes('accepted')) return ['check', 'tone-green'];
  if (e.includes('rejected') || e.includes('declined')) return ['x', 'tone-red'];
  if (e.includes('viewed')) return ['eye', 'tone-cyan'];
  if (e.includes('expired')) return ['hour', 'tone-amber'];
  if (e.includes('invoice')) return ['receipt', 'tone-green'];
  if (e.includes('change')) return ['message', 'tone-amber'];
  if (e.includes('follow')) return ['clock', 'tone-blue'];
  if (e.includes('note')) return ['note', 'tone-slate'];
  if (ch === 'email') return ['mail', 'tone-blue'];
  if (ch === 'whatsapp') return ['wa', 'tone-green'];
  if (ch === 'sms') return ['sms', 'tone-blue'];
  if (ch === 'telegram') return ['tg', 'tone-blue'];
  if (ch === 'link') return ['link', 'tone-slate'];
  if (e.includes('customer added')) return ['userplus', 'tone-slate'];
  return ['file', 'tone-slate'];
}
function timelineHTML(list, limit = 50) {
  if (!list.length) return `<div class="empty">${I('clock')}<h4>No activity yet</h4><p>Events appear here as quotations are shared and answered.</p></div>`;
  return `<div class="timeline">${list.slice(0, limit).map(x => { const [ic, tone] = tlIcon(x.ch, x.ev); return `<div class="tl"><span class="ti ${tone}">${I(ic)}</span><div class="tt"><b>${esc(x.ev)}</b>${x.sub ? ` <span class="muted">${x.sub}</span>` : ''}<small>${ftime(x.ts)}${x.to ? ` · ${esc(x.to)}` : ''}${x.chLabel ? ` · ${esc(x.chLabel)}` : ''}</small>${x.msg ? `<div class="tq">${esc(x.msg)}</div>` : ''}</div></div>`; }).join('')}</div>`;
}

    <div class="field"><label for="nc-name">Contact name</label><input class="input" id="nc-name" autofocus placeholder="e.g. Kavya Rao"></div>
    <div class="field"><label for="nc-co">Company</label><input class="input" id="nc-co" placeholder="e.g. Lumen Clinics"></div>
    <div class="field"><label for="nc-email">Email</label><input class="input" id="nc-email" type="email" placeholder="name@company.com"></div>
    <div class="field"><label for="nc-phone">WhatsApp / phone</label><input class="input" id="nc-phone" placeholder="+91 98xxx xxxxx"></div>
    <div class="field"><label for="nc-type">Customer type</label><select class="select" id="nc-type"><option>Business</option><option>Individual</option><option>Government</option></select></div>
    <div class="field"><label for="nc-city">City</label><input class="input" id="nc-city" placeholder="Pune"></div>
    <div class="field"><label for="nc-gst">GSTIN (optional)</label><input class="input" id="nc-gst" placeholder="27ABCDE1234F1Z5"></div>
    <div class="field"><label for="nc-owner">Account owner</label><select class="select" id="nc-owner">${SALES.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>

  <div class="mf"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" id="nc-save">Add customer</button></div>`);

    const v = id => $('#' + id).value.trim();
    const errs = [];
    if (!v('nc-name')) errs.push('contact name');
    if (!/^\S+@\S+\.\S+$/.test(v('nc-email'))) errs.push('a valid email');
    if (v('nc-phone') && v('nc-phone').replace(/\D/g, '').length < 10) errs.push('a 10-digit phone number');
    ['nc-name', 'nc-email'].forEach(id => $('#' + id).classList.toggle('err', id === 'nc-name' ? !v(id) : !/^\S+@\S+\.\S+$/.test(v(id))));
    if (errs.length) { $('#nc-err').textContent = 'Add ' + errs.join(', ') + ' to continue.'; return; }
    const c = { id: uid('c'), name: v('nc-name'), company: v('nc-co') || v('nc-name'), email: v('nc-email'), phone: v('nc-phone') || '', type: v('nc-type'), city: v('nc-city') || 'Pune', since: iso(TODAY), gstin: v('nc-gst'), owner: v('nc-owner'), address: v('nc-city') || 'Pune' };

  };
};

A.addFollowup = el => {
  const cid = el.dataset.cid || ''; const qid = el.dataset.qid || '';
  const custOpts = (cid ? [cust(cid)] : S.customers.slice(0, 500)).map(c => `<option value="${c.id}" ${c.id === cid ? 'selected' : ''}>${esc(c.name)} · ${esc(c.company)}</option>`).join('');
  openModal(`${mHead('Add follow-up', 'Set a reminder so no quotation goes quiet.')}
  <div class="mb stack">
    <div class="field"><label for="fu-c">Customer</label><select class="select" id="fu-c">${custOpts}</select></div>
    <div class="grid2">
      <div class="field"><label for="fu-type">Action</label><select class="select" id="fu-type">${['Call', 'Email', 'WhatsApp', 'Meeting', 'Site visit'].map(t => `<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="fu-date">Due date</label><input class="input" type="date" id="fu-date" value="${iso(addDays(TODAY, 1))}"></div>
      <div class="field"><label for="fu-sp">Assigned to</label><select class="select" id="fu-sp">${SALES.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
      <div class="field"><label for="fu-q">Related quotation</label><select class="select" id="fu-q"></select></div>
    </div>
    <div class="field"><label for="fu-note">Next action</label><textarea class="textarea" id="fu-note" placeholder="e.g. Call to walk through the revised pricing" autofocus></textarea></div>
  </div>
  <div class="mf"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" id="fu-save">Add follow-up</button></div>`);
  const fillQ = () => { const c = $('#fu-c').value; $('#fu-q').innerHTML = `<option value="">None</option>` + qOf(c).slice().reverse().map(q => `<option value="${q.id}" ${q.id === qid ? 'selected' : ''}>${q.no} · ${esc(q.project)}</option>`).join(''); const cc = cust(c); if (cc) $('#fu-sp').value = cc.owner; };
  fillQ(); $('#fu-c').onchange = fillQ;
  $('#fu-save').onclick = () => {
    const note = $('#fu-note').value.trim();
    if (!note) { $('#fu-note').classList.add('err'); $('#fu-note').focus(); return; }
    const f = { id: uid('f'), cid: $('#fu-c').value, qid: $('#fu-q').value || null, type: $('#fu-type').value, due: $('#fu-date').value || iso(TODAY), sp: $('#fu-sp').value, status: 'pending', note, created: Date.now() };
    S.followups.push(f);
    if (f.qid) quote(f.qid).comms.push({ ch: 'system', ev: 'Follow-up added', ts: Date.now(), to: spName(f.sp), msg: `${f.type} on ${fdate(f.due)}: ${note}` });
    closeModal(); toast('Follow-up added', `${f.type} with ${cust(f.cid).name} on ${fdate(f.due)}`); rerender(); setNav(CURRENT);
  };
};
A.fuDone = el => {
  const f = S.followups.find(x => x.id === el.dataset.id);
  f.status = f.status === 'done' ? 'pending' : 'done';
  if (f.status === 'done') { f.doneAt = Date.now(); toast('Follow-up completed', `${f.type} with ${cust(f.cid).name}`); }
  rerender(); setNav(CURRENT);
};
A.fuSnooze = el => { const f = S.followups.find(x => x.id === el.dataset.id); const base = f.due < iso(TODAY) ? TODAY : parse(f.due); f.due = iso(addDays(base, +el.dataset.days || 1)); toast('Follow-up rescheduled', `Now due ${fdate(f.due)}`); rerender(); setNav(CURRENT); };

A.sendReminder = el => {
  const c = cust(el.dataset.cid);
  const open = qOf(c.id).filter(q => ['sent', 'viewed'].includes(q.status));
  if (!open.length) { toast('No open quotations', `${c.name} has nothing awaiting a response`, 'warn'); return; }
  openShare(open[open.length - 1].id, 'email', true);
};
A.productOpen = el => { closeFloating(); go('#/app/products'); setTimeout(() => A.productEdit({ dataset: { id: el.dataset.id } }), 60); };

</script>

function periodRange(p) {

}
const inR = (dateStr, a, b) => { const d = parse(dateStr); return d >= a && d < b; };
function qStats(qs) {

    pen: qs.filter(q => ['sent', 'viewed'].includes(q.status)).length, exp: by('expired').length, draft: by('draft').length,
    sent: sent.length, viewed: qs.filter(q => q.viewedAt).length, accV: acc.reduce((s, q) => s + q.total, 0),
    conv: pct(acc.length, sent.length), avg: qs.length ? qs.reduce((s, q) => s + q.total, 0) / qs.length : 0,

}
function gotoQuotes(status) { QS.quotes = Object.assign(QS.quotes || {}, { status: status || 'all', page: 1 }); go('#/app/quotations'); }

  const vpTot = vp.reduce((s, x) => s + x[1], 0) || 1;

  const html = `

  <div class="dgrid">

      <div class="legend" style="margin-top:12px;justify-content:center">${['draft', 'sent', 'viewed', 'accepted', 'rejected', 'expired'].map(s => `<span data-a="kpiGo" data-t="${s === 'sent' || s === 'viewed' ? 'pending' : s === 'draft' ? 'all' : s}"><i style="background:var(--${{ draft: 'slate', sent: 'blue', viewed: 'cyan', accepted: 'accent', rejected: 'red', expired: 'amber' }[s]})"></i>${cap(s)} <b class="num">${cur.filter(q => q.status === s).length}</b></span>`).join('')}</div></div></div>

function bindDrag() {
  let from = null;
  $$('#items-body tr[draggable]').forEach(tr => {
    tr.addEventListener('dragstart', e => { if (!e.target.closest || document.activeElement?.tagName === 'INPUT') { } from = +tr.dataset.idx; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', from); } catch (x) { } });
    tr.addEventListener('dragover', e => { e.preventDefault(); $$('#items-body tr').forEach(r => r.classList.remove('drag-over')); tr.classList.add('drag-over'); });
    tr.addEventListener('drop', e => { e.preventDefault(); const to = +tr.dataset.idx; if (from === null || from === to) return; const it = BQ.items.splice(from, 1)[0]; BQ.items.splice(to, 0, it); from = null; bUpdate(true); });
    tr.addEventListener('dragend', () => $$('#items-body tr').forEach(r => r.classList.remove('drag-over')));
  });
  $$('#items-body input').forEach(i => { const r = () => $(`#items-body tr[draggable][data-idx="${i.dataset.idx}"]`) || { }; i.addEventListener('focus', () => r().draggable = false); i.addEventListener('blur', () => r().draggable = true); });
}
function bValidate() {
  const errs = [];
  if (!BQ.cid) errs.push('Select a customer');
  if (!BQ.items.some(i => i.type !== 'section' && i.name && (!colOn(qCols(BQ), 'qty') || i.qty > 0))) errs.push(colOn(qCols(BQ), 'qty') ? 'Add at least one item with a quantity' : 'Add at least one item');
  if (BQ.items.some(i => i.type !== 'section' && !i.name)) errs.push('Name every item line');
  if (BQ.expiry < BQ.date) errs.push('Valid-until date must be after the issue date');
  if (errs.length) { toast('Quotation not saved', errs.join('. ') + '.', 'err'); if (!BQ.cid) $('#b-cust')?.focus(); return false; }
  return true;
}
function bCommit() {
  const q = BQ; const T = calcQuote(q);
  if (!q.project) q.project = 'Untitled project';
  q.total = T.grand;
  const clean = JSON.parse(JSON.stringify(q)); delete clean._route;
  if (q.isNew) {
    delete clean.isNew; clean.created = Date.now(); clean.comms = [{ ch: 'system', ev: 'Quotation created', ts: Date.now(), to: '', by: spName(q.sp) }];
    clean.id = 'q' + S.settings.nextNo; S.settings.nextNo++;
    S.quotes.push(clean);
    const lead = S.leads.find(l => l.cid === clean.cid && !l.qid);
    if (lead) Object.assign(lead, { qid: clean.id, stage: 'created', value: clean.total, title: clean.project, last: Date.now() });
    else S.leads.push({ id: uid('l'), cid: clean.cid, qid: clean.id, title: clean.project, value: clean.total, stage: 'created', sp: clean.sp, last: Date.now(), fu: iso(addDays(TODAY, 3)) });
    BQ = null; BQ_DIRTY = false;
    return clean;
  } else {
    const i = S.quotes.findIndex(x => x.id === q.id);
    clean.comms = S.quotes[i].comms.concat([{ ch: 'system', ev: 'Quotation edited', ts: Date.now(), to: '' }]);
    S.quotes[i] = clean;
    const lead = S.leads.find(l => l.qid === q.id); if (lead) { lead.value = clean.total; lead.title = clean.project; }
    BQ = null; BQ_DIRTY = false;
    return clean;
  }
}

          <div class="row between"><span class="muted">Project</span><b style="font-weight:500">${esc(q.project)}</b></div>
          <div class="row between"><span class="muted">Issued</span><span>${fdate(q.date)}</span></div>
          <div class="row between"><span class="muted">Valid until</span><span class="${open && dl <= 3 ? 'overdue-t' : ''}">${fdate(q.expiry)}${open ? ` (${dl} days)` : ''}</span></div>
          <div class="row between"><span class="muted">Contact</span><span>${spName(q.sp)}</span></div>
        </div>
        ${open ? `<button class="btn primary lg" data-a="pAccept">${I('check')} Accept quotation</button>
          <div class="row"><button class="btn" style="flex:1" data-a="pChanges">${I('message', 'sm')} Request changes</button><button class="btn" style="flex:1" data-a="pReject">${I('x', 'sm')} Decline</button></div>`
      : `<div class="send-state ${q.status === 'accepted' ? 'ok' : ''}" style="${q.status === 'rejected' ? 'background:var(--red-soft);color:var(--red)' : q.status !== 'accepted' ? 'background:var(--amber-soft);color:var(--amber)' : ''}">${I(q.status === 'accepted' ? 'checkc' : q.status === 'rejected' ? 'xc' : 'info')}<div>${q.status === 'accepted' ? `<b style="font-weight:600">You accepted this quotation</b><div>${fdate(new Date(q.respondedAt))}. ${esc(s.bizName)} will be in touch about next steps.</div>` : q.status === 'rejected' ? `<b style="font-weight:600">You declined this quotation</b><div>Reason: ${esc(q.reason)}</div>` : q.status === 'expired' ? `<b style="font-weight:600">This quotation has expired</b><div>Request an updated quotation below.</div>` : `<b style="font-weight:600">Not shared yet</b><div>This quotation is still a draft. Send it first to let the customer respond.</div>`}</div></div>
        ${q.status === 'expired' ? `<button class="btn" data-a="pChanges">${I('message', 'sm')} Request an updated quotation</button>` : ''}
        ${q.status === 'draft' ? `<button class="btn primary" data-a="shareQ" data-id="${q.id}">${I('send', 'sm')} Send quotation</button>` : ''}`}
        <button class="btn ghost" data-a="pDownload">${I('download', 'sm')} Download PDF</button>
        ${q.feedback?.length ? `<div style="border-top:1px solid var(--line);padding-top:12px"><span class="lbl">Your change requests</span>${q.feedback.map(f => `<div class="tq" style="margin-top:6px;background:var(--surface-2);border-radius:6px;padding:8px;font-size:12.5px">${esc(f.text)}<div class="lr-s">${rel(f.ts)}</div></div>`).join('')}</div>` : ''}
        <p class="muted" style="font-size:12px">Questions? Call ${esc(s.phone)} or reply to the email you received.</p>
      </aside>
    </div></div>`;
  UI.portalHit = false;
  return {};
}
A.pDownload = () => { toast('PDF download simulated', 'In the full product the quotation PDF downloads here'); };
A.pAccept = () => {
  const q = quote(location.hash.split('/').pop()); const c = cust(q.cid); const T = calcQuote(q);
  openModal(`${mHead('Accept quotation', `${q.no} · ${money2(T.grand)}`)}
  <div class="mb stack">
    <p style="color:var(--ink-2)">By accepting, you confirm the scope, pricing and terms in this quotation from ${esc(S.settings.bizName)}.</p>
    <div class="grid2"><div class="field"><label for="pa-name">Your full name</label><input class="input" id="pa-name" value="${esc(c.name)}"></div><div class="field"><label for="pa-po">PO number (optional)</label><input class="input" id="pa-po" placeholder="e.g. PO-2291"></div></div>

    <label class="row" style="font-size:13px;cursor:pointer;align-items:flex-start"><input type="checkbox" id="pa-ok" style="margin-top:3px"> I agree to the terms and conditions${+q.advance ? ` and the ${q.advance}% advance of ${money(T.adv)}` : ''}.</label>

/* ================= item column manager ================= */
let CW = null; // working copy while the dialog is open
const COL_KIND = { number: 'Number', text: 'Text', unit: 'List', tax: 'Tax rate' };
function cwInit() { CW = { cols: workspaceCols(), flatTax: S.settings.itemFlatTax ?? +S.settings.defaultTax, nt: 'text', nm: false, drafts: false }; }
function cwApplyTo(q) {
  const removed = qCols(q).filter(c => c.custom && !CW.cols.some(x => x.key === c.key)).map(c => c.key);
  q.items.forEach(it => { if (it.cf) removed.forEach(k => delete it.cf[k]); });
  q.cols = JSON.parse(JSON.stringify(CW.cols)); q.flatTax = CW.flatTax;
}
A.cwSave = () => {
  if (!CW) return;
  const bad = CW.cols.find(c => !c.label.trim()); if (bad) { toast('Every column needs a name', '', 'err'); return; }
  CW.cols.forEach(c => c.label = c.label.trim());
  S.settings.itemCols = JSON.parse(JSON.stringify(CW.cols)); S.settings.itemFlatTax = CW.flatTax;
  let n = 0;
  if (CW.drafts) S.quotes.forEach(q => { if (q.status === 'draft') { cwApplyTo(q); n++; } });
  if (BQ && BQ.isNew) cwApplyTo(BQ);
  flashSaved();
  toast('Item columns saved', CW.drafts ? `Used for new quotations and ${n} draft${n === 1 ? '' : 's'}` : 'Used for every new quotation');
};
A.cwReset = () => { CW.cols = defaultCols(); CW.flatTax = +S.settings.defaultTax; drawCols(); toast('Columns reset to the standard layout', 'Click Save columns to keep this'); };
function drawCols() {
  const b = $('#cw-body'); if (!b) return;
  const L = CW.cols, mid = L.filter(c => !['name', 'amount'].includes(c.key));
  const row = c => {
    const i = L.indexOf(c), fixed = c.key === 'name' || c.key === 'amount';
    const mi = mid.indexOf(c);
    return `<div class="cw-row${c.on ? '' : ' off'}">
      <div class="cw-move">${fixed ? `<span class="cw-pin" title="Always ${c.key === 'name' ? 'first' : 'last'}">${I('lock', 'sm')}</span>` : `<button class="btn sm ghost icon" data-a="cwMove" data-i="${i}" data-d="-1" ${mi === 0 ? 'disabled' : ''} aria-label="Move up">${I('up', 'sm')}</button><button class="btn sm ghost icon" data-a="cwMove" data-i="${i}" data-d="1" ${mi === mid.length - 1 ? 'disabled' : ''} aria-label="Move down">${I('down', 'sm')}</button>`}</div>
      <input class="input" value="${esc(c.label)}" data-in="cwLabel" data-i="${i}" aria-label="Column name" maxlength="28">
      <span class="cw-kind">${c.custom ? 'Custom' : 'Built-in'} · ${COL_KIND[c.type] || 'Text'}</span>
      <div class="cw-acts">
        ${c.custom && c.type === 'number' ? `<label class="cw-mult" title="Multiply this value into the line amount, like quantity"><input type="checkbox" data-ch="cwMult" data-i="${i}" ${c.mult ? 'checked' : ''}> × amount</label>` : '<span></span>'}
        ${c.lock ? `<span class="cw-req">Required</span>` : `<button class="toggle ${c.on ? 'on' : ''}" data-a="cwToggle" data-i="${i}" role="switch" aria-checked="${c.on}" aria-label="Show ${esc(c.label)}"></button>`}
        ${c.custom ? `<button class="btn sm ghost icon danger" data-a="cwDel" data-i="${i}" aria-label="Delete ${esc(c.label)}">${I('trash', 'sm')}</button>` : '<span></span>'}
      </div></div>
      ${c.key === 'tax' && !c.on ? `<div class="cw-note">${I('info', 'sm')} Tax per line is off. Apply one rate to every item: <select class="select" data-ch="cwFlat" style="width:auto;height:30px">${TAXES.map(t => `<option value="${t}" ${CW.flatTax === t ? 'selected' : ''}>${t === 0 ? 'No tax' : t + '%'}</option>`).join('')}</select></div>` : ''}
      ${c.key === 'qty' && !c.on ? `<div class="cw-note">${I('info', 'sm')} Quantity is off, so every line counts as 1 × rate.</div>` : ''}`;
  };
  b.innerHTML = `<div class="cw-list">${L.map(row).join('')}</div>
    <div class="cw-add">
      <b>Add your own column</b>
      <div class="cw-add-row">
        <input class="input" id="cw-nn" placeholder="e.g. Brand, Colour, Hours, Warranty" maxlength="28" aria-label="New column name">
        <select class="select" id="cw-nt" aria-label="Column type"><option value="text" ${CW.nt === 'text' ? 'selected' : ''}>Text</option><option value="number" ${CW.nt === 'number' ? 'selected' : ''}>Number</option></select>
        <button class="btn" data-a="cwAdd">${I('plus', 'sm')} Add column</button>
      </div>
      <label class="cw-mult" id="cw-nm-wrap" style="${CW.nt === 'number' ? '' : 'display:none'}"><input type="checkbox" id="cw-nm" ${CW.nm ? 'checked' : ''}> Multiply into the line amount (e.g. Hours × Rate, or Days × Qty × Rate)</label>
      <p class="hint">${esc(colLabel(L, 'name'))}, ${esc(colLabel(L, 'price'))} and ${esc(colLabel(L, 'amount'))} drive the totals, so they can be renamed but not removed. Everything else can be hidden, reordered or deleted.</p>
    </div>`;
  $('#cw-nt').onchange = e => { CW.nt = e.target.value; $('#cw-nm-wrap').style.display = CW.nt === 'number' ? '' : 'none'; };
  $('#cw-nm').onchange = e => CW.nm = e.target.checked;
  $('#cw-nn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); A.cwAdd(); } };
}
IN.cwLabel = el => { CW.cols[+el.dataset.i].label = el.value; };
IN.cwMult = el => { CW.cols[+el.dataset.i].mult = el.checked; drawCols(); };
IN.cwFlat = el => { CW.flatTax = +el.value; };
A.cwToggle = el => { const c = CW.cols[+el.dataset.i]; c.on = !c.on; drawCols(); };
A.cwMove = el => {
  const i = +el.dataset.i, d = +el.dataset.d, L = CW.cols; let j = i + d;
  while (L[j] && ['name', 'amount'].includes(L[j].key)) j += d;
  if (!L[j]) return; [L[i], L[j]] = [L[j], L[i]]; drawCols();
};
A.cwDel = el => { const i = +el.dataset.i; const c = CW.cols[i]; CW.cols.splice(i, 1); drawCols(); toast(`“${c.label}” removed`, 'Click Save columns to keep this'); };
A.cwAdd = () => {
  const inp = $('#cw-nn'); const nm = inp.value.trim();
  if (!nm) { inp.focus(); toast('Give the column a name', '', 'err'); return; }
  if (CW.cols.some(c => c.label.toLowerCase() === nm.toLowerCase())) { toast('A column with that name already exists', '', 'err'); return; }
  const at = CW.cols.findIndex(c => c.key === 'amount');
  CW.cols.splice(at, 0, { key: 'c_' + uid('').slice(-6), label: nm, type: CW.nt, custom: true, on: true, mult: CW.nt === 'number' && CW.nm });
  CW.nm = false; drawCols(); setTimeout(() => $('#cw-nn')?.focus(), 20);
};

/* ---------- builder: customer PO, shipping address, TDS and round-off ---------- */
IN.bPoHas = el => { BQ.po = BQ.po || { has: false, no: '', date: '', ref: '' }; BQ.po.has = el.checked; bUpdate(true); };
IN.bPo = el => { BQ.po = BQ.po || { has: true, no: '', date: '', ref: '' }; BQ.po[el.dataset.f] = el.value; bUpdate(); };
IN.bShipSame = el => {
  BQ.shipSame = el.checked;
  if (!el.checked && !BQ.shipTo) { const c = cust(BQ.cid); BQ.shipTo = c ? { name: c.company, address: c.address, city: c.city, state: c.state, pin: c.pin, gstin: c.gstin } : { name: '', address: '', city: '', state: S.settings.state, pin: '', gstin: '' }; }
  bUpdate(true);
};
IN.bShip = el => { BQ.shipTo = BQ.shipTo || {}; BQ.shipTo[el.dataset.f] = el.value; bUpdate(); };
IN.bTds = el => { BQ.tds = BQ.tds || { on: false, rate: 2 }; BQ.tds.on = el.checked; bUpdate(true); };
IN.bTdsRate = el => { BQ.tds = BQ.tds || { on: true, rate: 2 }; BQ.tds.rate = +el.value || 0; bUpdate(true); };
IN.bRound = el => { BQ.roundOff = el.checked; bUpdate(true); };

</script>
<script>
/* ================= customer intelligence ================= */
QS.cust = { seg: 'all', q: '', sp: 'all', range: 'all', type: 'all', status: 'all', sort: 'total', dir: -1, page: 1, per: 10 };
const SEGMENTS = [
  ['new', 'New customers', 'Added in the last 90 days', 'userplus', 'tone-blue'],
  ['returning', 'Returning', 'Two or more quotations', 'refresh', 'tone-green'],
  ['high', 'High value', 'Accepted business ≥ ₹7 L', 'trend', 'tone-green'],
  ['pending', 'Pending quotations', 'Awaiting a response', 'hour', 'tone-cyan'],
  ['rejected', 'Rejected a quote', 'At least one decline', 'x', 'tone-red'],
  ['followup', 'Needs follow-up', 'Viewed or reminder due', 'clock', 'tone-amber'],
  ['expired', 'Expired quotes', 'Let a quotation lapse', 'alert', 'tone-amber'],
  ['inactive', 'No quote activity', 'Never quoted yet', 'user', 'tone-slate'],
];
const CSTATUS = { returning: ['s-accepted', 'Returning'], active: ['s-accepted', 'Customer'], pending: ['s-viewed', 'Awaiting'], new: ['s-new', 'New'], lost: ['s-rejected', 'At risk'], inactive: ['s-draft', 'No activity'] };
const cStatusBadge = k => `<span class="badge ${CSTATUS[k][0]}">${CSTATUS[k][1]}</span>`;

function allCustStats() {
  const byC = {};
  for (const q of S.quotes) (byC[q.cid] = byC[q.cid] || []).push(q);
  const pendFu = new Set(S.followups.filter(f => f.status === 'pending').map(f => f.cid));
  return S.customers.map(c => {
    const qs = byC[c.id] || [];
    const acc = qs.filter(q => q.status === 'accepted'), rej = qs.filter(q => q.status === 'rejected');
    const pen = qs.filter(q => ['sent', 'viewed'].includes(q.status)), exp = qs.filter(q => q.status === 'expired');
    const total = qs.reduce((s, q) => s + q.total, 0), accV = acc.reduce((s, q) => s + q.total, 0);
    const decided = acc.length + rej.length;
    const st = { qs, n: qs.length, acc: acc.length, rej: rej.length, pen: pen.length, exp: exp.length, total, accV, conv: decided ? pct(acc.length, decided) : 0, last: qs.reduce((m, q) => q.date > m ? q.date : m, ''), avg: qs.length ? total / qs.length : 0 };
    const tags = [];
    if (daysBetween(c.since, iso(TODAY)) <= 90) tags.push('new');
    if (st.n >= 2) tags.push('returning');
    if (st.accV >= 700000) tags.push('high');
    if (st.pen) tags.push('pending');
    if (st.rej) tags.push('rejected');
    if (st.exp) tags.push('expired');
    if (!st.n) tags.push('inactive');
    if (pendFu.has(c.id) || pen.some(q => q.status === 'viewed')) tags.push('followup');
    return { c, st, tags, status: custStatus(st, c)[0] };
  });
}

function pageCustomers() {
  refreshExpiry();
  const st = QS.cust; const today = iso(TODAY);
  const all = allCustStats();
  const segCount = {}; const segVal = {};
  all.forEach(r => r.tags.forEach(t => { segCount[t] = (segCount[t] || 0) + 1; segVal[t] = (segVal[t] || 0) + r.st.total; }));

  // overview
  const quoted = all.filter(r => r.st.n);
  const received = all.filter(r => r.st.qs.some(q => q.status !== 'draft'));
  const viewed = all.filter(r => r.st.qs.some(q => q.viewedAt));
  const accC = all.filter(r => r.st.acc), rejC = all.filter(r => r.st.rej), penC = all.filter(r => r.st.pen), expC = all.filter(r => r.st.exp);
  const invC = new Set(S.invoices.map(i => i.cid).concat(S.orders.map(o => o.cid)));
  const totalV = S.quotes.reduce((s, q) => s + q.total, 0);
  const custConv = pct(accC.length, received.length);
  const ov = [
    ['Total customers', numF(all.length), 'all', 'users'], ['New customers', numF(segCount.new || 0), 'new', 'userplus'],
    ['Returning', numF(segCount.returning || 0), 'returning', 'refresh'], ['Received quotations', numF(received.length), 'all', 'send'],
    ['Accepted', numF(accC.length), 'high', 'check'], ['Rejected', numF(rejC.length), 'rejected', 'x'],
    ['Awaiting response', numF(penC.length), 'pending', 'hour'], ['With expired quotes', numF(expC.length), 'expired', 'alert'],
    ['Customer conversion', custConv + '%', null, 'target'], ['Total quoted value', moneyC(totalV), null, 'rupee'],
  ];

  const journey = [
    ['Customer added', all.length, null], ['Quotation created', quoted.length, all.length], ['Quotation sent', received.length, quoted.length],
    ['Quotation viewed', viewed.length, received.length], ['split', [accC.length, rejC.length], viewed.length], ['Invoice / order', invC.size, accC.length],
  ];

  const funnel = [['Total customers', all.length, '--ink', 'all'], ['Received quotations', received.length, '--slate', 'all'], ['Viewed a quotation', viewed.length, '--cyan', 'followup'], ['Accepted', accC.length, '--accent', 'high'], ['Rejected', rejC.length, '--red', 'rejected'], ['Awaiting response', penC.length, '--blue', 'pending']];

  // filter
  let rows = all.filter(r => {
    if (st.seg !== 'all' && !r.tags.includes(st.seg)) return false;
    if (st.sp !== 'all' && r.c.owner !== st.sp) return false;
    if (st.type !== 'all' && r.c.type !== st.type) return false;
    if (st.status !== 'all' && r.status !== st.status) return false;
    if (st.range !== 'all') { const d = r.st.last || r.c.since; if (daysBetween(d, today) > +st.range) return false; }
    if (st.q && !(r.c.name + ' ' + r.c.company + ' ' + r.c.email + ' ' + r.c.city).toLowerCase().includes(st.q.toLowerCase())) return false;
    return true;
  });
  const key = { total: r => r.st.total, accV: r => r.st.accV, conv: r => r.st.conv + r.st.acc / 100, n: r => r.st.n, acc: r => r.st.acc, rej: r => r.st.rej, pen: r => r.st.pen, last: r => r.st.last || '0', name: r => r.c.name.toLowerCase(), company: r => r.c.company.toLowerCase() }[st.sort] || (r => r.st.total);

  const qs = st.qs.slice().sort((a, b) => b.date.localeCompare(a.date));
  const open = qs.filter(q => ['draft', 'sent', 'viewed'].includes(q.status));
  const fus = S.followups.filter(f => f.cid === id).sort((a, b) => (a.status === b.status ? a.due.localeCompare(b.due) : a.status === 'pending' ? -1 : 1));
  const notes = S.notes.filter(n => n.cid === id).sort((a, b) => b.ts - a.ts);
  const invs = S.invoices.filter(i => i.cid === id);
  const tags = custSegment(c, st);

  // timeline
  const tl = [{ ch: 'system', ev: 'Customer added', ts: +parse(c.since) + 9 * 3600000, to: spName(c.owner) }];
  qs.forEach(q => q.comms.forEach(x => tl.push({ ...x, ev: `${x.ev}`, sub: `<a data-a="go" data-to="#/app/quotations/${q.id}" style="cursor:pointer">${q.no}</a>` })));
  S.followups.filter(f => f.cid === id && f.created).forEach(f => { if (!f.qid) tl.push({ ch: 'system', ev: 'Follow-up added', ts: f.created, to: spName(f.sp), msg: `${f.type} on ${fdate(f.due)}: ${f.note}` }); if (f.doneAt) tl.push({ ch: 'system', ev: 'Follow-up completed', ts: f.doneAt, to: spName(f.sp), msg: f.note }); });
  notes.forEach(n => tl.push({ ch: 'system', ev: 'Note added', ts: n.ts, to: n.by, msg: n.text }));

<script>

QS.prod = { q: '', cat: 'all', status: 'all', sort: 'quoted', dir: -1, page: 1, per: 10 };
function prodStats() {
  const m = {};
  S.products.forEach(p => m[p.id] = { n: 0, qty: 0, v: 0, accV: 0, acc: 0, rej: 0, qids: new Set() });
  for (const q of S.quotes) for (const it of q.items) {
    if (it.type === 'section' || !it.pid || !m[it.pid]) continue;
    const r = m[it.pid]; const v = it.qty * it.price * (1 - (it.disc || 0) / 100);
    r.v += v; r.qty += +it.qty;
    if (!r.qids.has(q.id)) { r.qids.add(q.id); r.n++; if (q.status === 'accepted') r.acc++; if (q.status === 'rejected') r.rej++; }
    if (q.status === 'accepted') r.accV += v;
  }
  Object.values(m).forEach(r => r.conv = r.acc + r.rej ? pct(r.acc, r.acc + r.rej) : 0);
  return m;
}

    ${view.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${sortTh('prod', 'name', 'Item')}${sortTh('prod', 'cat', 'Category')}<th>SKU</th><th>HSN/SAC</th>${sortTh('prod', 'price', 'Price', 'r')}<th>Tax</th>${sortTh('prod', 'margin', 'Margin', 'r')}${sortTh('prod', 'quoted', 'Quoted', 'r')}${sortTh('prod', 'value', 'Quoted value', 'r')}${sortTh('prod', 'conv', 'Conversion')}<th>Active</th><th class="r">Actions</th></tr></thead><tbody>

    </tbody></table></div>${pager('prod', total, st.per)}` : `<div class="empty">${I('box')}<h4>No items match</h4><p>Change the filters or add a new product or service.</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-a="prodClear">Clear filters</button><button class="btn primary" data-a="productEdit">${I('plus')} Add product</button></div></div>`}

A.setSvN = el => { S.settings[el.dataset.k] = +el.dataset.v; rerender(); flashSaved(); };

<script>
/* ================= sales documents: invoices, payments, receipts, challans, credit & debit notes ================= */

const amtWords = n => `Rupees ${numberToWordsIN(Math.round(n))} Only`;
const payOf = id => S.payments.filter(p => p.invId === id).sort((a, b) => a.date < b.date ? -1 : 1);
const invoice = id => S.invoices.find(i => i.id === id);
const challan = id => S.challans.find(d => d.id === id);
const order = id => S.orders.find(o => o.id === id);
const invBal = i => Math.max(0, Math.round((i.amount - i.paid) * 100) / 100);
const cnOf = id => S.cnotes.filter(n => n.invId === id);
const dnOf = id => S.dnotes.filter(n => n.invId === id);
const invDue = i => daysBetween(iso(TODAY), i.due);
function invStatus(i) {
  if (['draft', 'void'].includes(i.status)) return i.status;
  if (i.paid >= i.amount - 0.5) return 'paid';
  if (i.due < iso(TODAY)) return 'overdue';
  return i.paid > 0 ? 'partially-paid' : 'sent';
}
function syncInvoice(i) { i.paid = payOf(i.id).reduce((s, p) => s + p.amount, 0); if (!['draft', 'void'].includes(i.status)) i.status = invStatus(i); }
const shipOf = doc => { const c = cust(doc.cid); return doc.shipSame === false && doc.shipTo ? doc.shipTo : (c.shipSame === false && c.shipTo ? c.shipTo : { name: c.company, address: c.address, city: c.city, state: c.state, pin: c.pin, gstin: c.gstin }); };
const dueFrom = (date, code, days) => iso(addDays(parse(date), code === 'custom' ? (+days || 0) : termDays(code)));

/* ---------- address + bank blocks shared by the documents ---------- */
function addrBlock(title, a, extra = '') {
  return `<div><small class="muted">${title}</small>
    <div><b style="font-weight:600">${esc(a.name || a.company || '')}</b></div>
    <div class="lr-s">${esc(a.address || '')}${a.city ? `<br>${esc(a.city)}${a.state ? ', ' + esc(a.state) : ''}${a.pin ? ' - ' + esc(a.pin) : ''}` : ''}${a.gstin ? `<br>GSTIN ${esc(a.gstin)}` : ''}${extra}</div></div>`;
}
function bankBlock() {
  const b = S.settings.bank;
  return `<div class="pay-details"><small class="muted">Payment details</small>
    <div class="pd-grid">
      <span>Account name</span><b>${esc(b.accName)}</b>
      <span>Bank</span><b>${esc(b.bankName)}</b>
      <span>A/C no.</span><b>${esc(b.acc.length > 4 ? 'XXXXXXXX' + b.acc.slice(-4) : b.acc)}</b>
      <span>IFSC</span><b>${esc(b.ifsc)}</b>
      <span>Branch</span><b>${esc(b.branch)}</b>
      ${b.upi ? `<span>UPI</span><b>${esc(b.upi)}</b>` : ''}
    </div>${b.qr ? `<div class="qr" title="UPI QR (demo)">${qrSvg()}<small>Scan to pay</small></div>` : ''}</div>`;
}
function qrSvg() {
  let r = 7; const rnd2 = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  let cells = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = finder ? (x % 6 === 0 || y % 6 === 0 || (x > 1 && x < 5 && y > 1 && y < 5) || (x > 15 && x < 19 && y > 1 && y < 5) || (x > 1 && x < 5 && y > 15 && y < 19)) : rnd2() > .55;
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 21 21" width="74" height="74" aria-label="UPI QR code (demo)">${cells}</svg>`;
}

/* ---------- the invoice document ---------- */
function invoiceDoc(i, forPrint = false) {
  const c = cust(i.cid), q = quote(i.qid), o = order(i.oid), dc = S.challans.find(d => d.id === i.dcid) || S.challans.find(d => d.oid === i.oid);
  if (q && (q.template || S.settings.template) === 'tally') return tallyDoc(q, { inv: i });
  const s = S.settings, T = q ? calcQuote(q) : null;
  const bal = invBal(i), st = invStatus(i);
  const ship = shipOf(q || i);
  const cols = q ? qCols(q) : null;
  const rows = T ? T.lines.filter(l => l.type !== 'section') : [];
  const advAmt = i.advance ? Math.round((i.amount * i.advance / 100) * 100) / 100 : 0;
  return `<div class="inv-paper ${forPrint ? 'print-target' : ''}" style="--doc-accent:${s.brand}">
    <div class="ip-head">
      <div class="row" style="gap:12px;align-items:flex-start">
        <div class="d-logo-sm" style="background:${s.brand}">${s.logo ? `<img src="${s.logo}" alt="">` : esc(initials(s.bizName))}</div>
        <div><b class="ip-biz">${esc(s.bizName)}</b>
          <div class="lr-s">${esc(s.legal)}<br>${esc(s.address)}, ${esc(s.city)}<br>${esc(s.phone)} · ${esc(s.email)} · ${esc(s.website)}<br>GSTIN ${esc(s.gstin)}</div></div>
      </div>
      <div class="ip-title"><h2>Tax invoice</h2>${badge(st, INV_LABEL[st] || cap(st))}</div>
    </div>
    <div class="ip-meta">
      ${[['Invoice no.', i.no], ['Invoice date', fdate(i.date)], ['Due date', fdate(i.due)], ['Payment terms', termLabel(i.termsCode, i.termsDays)],
         ...(i.po && i.po.has ? [['Customer PO', i.po.no], ['PO date', i.po.date ? fdate(i.po.date) : '—']] : []),
         ...(o ? [['Sales order', o.no]] : []), ...(q ? [['Quotation', q.no]] : []),
         ...(dc ? [['Delivery challan', dc.no]] : []),
         ...(i.jobNo ? [['Job number', i.jobNo]] : []), ...(q && q.project ? [['Project', q.project]] : [])]
        .map(([k, v]) => `<div><span>${k}</span><b>${esc(String(v))}</b></div>`).join('')}
    </div>
    <div class="ip-parties">
      ${addrBlock('Bill to', { name: c.company, address: c.address, city: c.city, state: c.state, pin: c.pin, gstin: c.gstin }, `<br>${esc(c.name)} · ${esc(c.phone)}`)}
      ${addrBlock('Ship to', ship)}
    </div>

const INV_LABEL = { draft: 'Draft', sent: 'Sent', paid: 'Paid', 'partially-paid': 'Partially paid', overdue: 'Overdue', void: 'Void' };

/* ---------- document relationship strip ---------- */
function relStrip(ctx) {
  const q = ctx.q, o = ctx.o, dc = ctx.dc, i = ctx.i, c = ctx.c;
  const pays = i ? payOf(i.id) : [];
  const item = (label, value, action) => `<div class="rel"><small>${label}</small>${value ? (action ? `<a ${action} style="cursor:pointer">${esc(value)}</a>` : `<b>${esc(value)}</b>`) : '<span class="muted">—</span>'}</div>`;
  return `<div class="rel-strip">
    ${item('Customer', c ? c.company : '', `data-a="go" data-to="#/app/customers/${c ? c.id : ''}"`)}
    ${item('Quotation', q ? q.no : '', q ? `data-a="go" data-to="#/app/quotations/${q.id}"` : '')}
    ${item('Customer PO', q && q.po && q.po.has ? q.po.no : (i && i.po && i.po.has ? i.po.no : ''), '')}
    ${item('Sales order', o ? o.no : '', o ? `data-a="ordView" data-id="${o.id}"` : '')}
    ${item('Delivery challan', dc ? dc.no : '', dc ? `data-a="dcView" data-id="${dc.id}"` : '')}
    ${item('Invoice', i ? i.no : '', i ? `data-a="go" data-to="#/app/invoices/${i.id}"` : '')}
    <div class="rel"><small>Payments</small>${pays.length ? pays.map(p => `<a data-a="rcptView" data-id="${p.id}" style="cursor:pointer">${esc(p.rcpt || p.no)}</a>`).join(' ') : '<span class="muted">—</span>'}</div>
  </div>`;
}

/* ---------- invoice detail page ---------- */

  syncInvoice(i);
  const c = cust(i.cid), q = quote(i.qid), o = order(i.oid), dc = S.challans.find(d => d.id === i.dcid) || S.challans.find(d => d.oid === i.oid);
  const bal = invBal(i), st = invStatus(i), dl = invDue(i), pays = payOf(i.id);
  const html = `
  <div class="crumbs"><a data-a="go" data-to="#/app/invoices">Invoices</a> ${I('right', 'sm')} <span>${esc(i.no)}</span></div>
  <div class="ph"><div class="row wrap" style="gap:10px"><h1 style="margin:0">${esc(i.no)}</h1>${badge(st, INV_LABEL[st])}
      ${bal > 0 && st !== 'draft' ? `<span class="lr-s ${dl < 0 ? 'overdue-t' : ''}">${dl < 0 ? `Overdue by ${-dl} day${dl === -1 ? '' : 's'}` : dl === 0 ? 'Due today' : `Due in ${dl} days`}</span>` : ''}</div>
    <div class="row wrap">
      ${bal > 0 ? `<button class="btn primary" data-a="invPay" data-id="${i.id}">${I('rupee', 'sm')} Record payment</button>` : ''}
      ${i.status === 'draft' ? `<button class="btn" data-a="invSend" data-id="${i.id}">${I('send', 'sm')} Mark as sent</button>`
        : bal > 0 ? `<button class="btn" data-a="invRemind" data-id="${i.id}">${I('bell', 'sm')} Send reminder</button>` : ''}
      <button class="btn wa" data-a="invWa" data-id="${i.id}">${I('wa', 'sm')} WhatsApp</button>
      <button class="btn" data-a="invPdf" data-id="${i.id}">${I('download', 'sm')} PDF</button>
      <button class="btn" data-a="invPrint" data-id="${i.id}">${I('printer', 'sm')} Print</button>
      <button class="btn icon" data-a="invMenu2" data-id="${i.id}" aria-label="More">${I('more')}</button>
    </div></div>
  ${relStrip({ q, o, dc, i, c })}
  <div class="doc-layout">
    <div>${invoiceDoc(i)}</div>
    <div class="stack">
      <div class="panel"><div class="panel-h"><h3>Payment summary</h3></div><div class="panel-b">
        <div class="pay-sum"><span>Invoice total</span><b>${money2(i.amount)}</b>
          ${i.advance ? `<span>Advance required (${i.advance}%)</span><b>${money2(Math.round(i.amount * i.advance) / 100)}</b>` : ''}
          <span>Amount paid</span><b class="ok">${money2(i.paid)}</b>
          <span class="g">Balance due</span><b class="g">${money2(bal)}</b></div>
        <div class="hbar" style="margin:10px 0 4px"><i style="width:${pct(i.paid, i.amount)}%"></i></div>
        <div class="lr-s">${pct(i.paid, i.amount)}% collected · ${termLabel(i.termsCode, i.termsDays)} · due ${fdate(i.due)}
          <button class="btn sm ghost" data-a="invDue" data-id="${i.id}">${I('edit', 'sm')} Change</button></div>
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Attachments <span class="muted">(${i.attachments ? i.attachments.length : 0})</span></h3><span class="spacer"></span><button class="btn sm" data-a="invAttach" data-id="${i.id}">${I('plus', 'sm')} Add</button></div>
        <div class="panel-b">${(i.attachments || []).length ? (i.attachments || []).map(a => `<div class="attach-row"><div class="row" style="gap:8px;min-width:0">${I('file', 'sm')}<div style="min-width:0"><b class="ell">${esc(a.name)}</b><small class="muted">${esc(a.kind)} · ${esc(a.size)}</small></div></div>
          <div class="row"><button class="btn sm ghost" data-a="attView" data-name="${esc(a.name)}">View</button><button class="btn sm ghost icon danger" data-a="attDel" data-id="${i.id}" data-aid="${a.id}" aria-label="Remove">${I('trash', 'sm')}</button></div></div>`).join('')
          : '<p class="muted" style="font-size:13px;margin:0">Customer PO, signed quotation, delivery challan or inspection reports can be attached here.</p>'}</div></div>
      <div class="panel"><div class="panel-h"><h3>Activity</h3></div><div class="panel-b">${auditHTML('invoice', i.id)}</div></div>
    </div>
  </div>
  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Payment history</h3><span class="spacer"></span>${bal > 0 ? `<button class="btn sm" data-a="invPay" data-id="${i.id}">${I('plus', 'sm')} Record payment</button>` : ''}</div>
        <div class="panel-b" style="padding:0">${pays.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Payment date</th><th class="r">Amount</th><th>Method</th><th>Reference</th><th>Bank</th><th>Recorded by</th><th class="r">Receipt</th></tr></thead><tbody>
          ${pays.map(p => `<tr><td>${fdate(p.date)}</td><td class="r num"><b style="font-weight:600">${money(p.amount)}</b></td>

            <td class="r"><button class="btn sm ghost" data-a="rcptView" data-id="${p.id}">${esc(p.rcpt || 'Receipt')}</button></td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty" style="padding:22px">${I('rupee')}<h4>No payments yet</h4><p>Record one when the customer pays.</p></div>`}</div></div>
`;
  return { html, title: i.no, keepScroll: false };
}
function auditHTML(type, id) {
  const list = auditOf(type, id);
  if (!list.length) return '<p class="muted" style="font-size:13px;margin:0">No activity recorded yet.</p>';
  return `<div class="timeline">${list.slice().reverse().map(a => `<div class="tl"><span class="tl-i tone-slate">${I('clock', 'sm')}</span>
    <div><b>${esc(a.action)}</b>${a.detail ? `<small class="blk">${esc(a.detail)}</small>` : ''}<small class="muted">${ftime(a.ts)} · ${esc(a.by)}</small></div></div>`).join('')}</div>`;
}

/* ---------- payments ---------- */
A.invPay = el => {
  closeFloating(); const i = invoice(el.dataset.id); const bal = invBal(i);
  const adv = i.advance ? Math.round(i.amount * i.advance) / 100 : 0;
  openModal(`${mHead('Record payment', `${esc(i.no)} · ${esc(cust(i.cid).company)} · balance ${money(bal)}`)}
  <div class="mb stack">
    ${adv > 0 && i.paid < adv ? `<div class="note-info">${I('info', 'sm')} Advance of ${money(adv)} (${i.advance}%) is due on this invoice.</div>` : ''}
    <div class="grid2">
      <div class="field"><label for="ip-a">Payment amount</label><input class="input" type="number" min="1" max="${bal}" id="ip-a" value="${Math.round(bal)}" autofocus></div>
      <div class="field"><label for="ip-d">Payment date</label><input class="input" type="date" id="ip-d" value="${iso(TODAY)}" max="${iso(TODAY)}"></div>
      <div class="field"><label for="ip-m">Payment method</label><select class="select" id="ip-m" data-ch="payMethod">${PAY_METHODS.map(m => `<option ${m === 'NEFT' ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div class="field" id="ip-ref-w"><label for="ip-r">Transaction / UTR number</label><input class="input" id="ip-r" placeholder="e.g. HDFC123456789"></div>
      <div class="field" id="ip-chq-w" style="display:none"><label for="ip-chq">Cheque number</label><input class="input" id="ip-chq" placeholder="e.g. 456123"></div>
      <div class="field" id="ip-bank-w"><label for="ip-bank">Bank name</label><input class="input" id="ip-bank" placeholder="e.g. HDFC Bank"></div>
    </div>
    <div class="field"><label for="ip-n">Notes</label><input class="input" id="ip-n" placeholder="Optional reference for your team"></div>
    <div class="field"><label>Attachment</label><label class="attach-drop" for="ip-file">${I('upload', 'sm')} <span id="ip-fname">Attach payment advice or receipt</span><input type="file" id="ip-file" hidden data-ch="payFile"></label></div>
    <p class="hint">Recording a payment updates the invoice status and the dashboard. No money moves in this demo.</p><p class="hint err" id="ip-err"></p></div>
  <div class="mf"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" id="ip-ok">${I('check', 'sm')} Record payment</button></div>`, 'wide');
  $('#ip-ok').onclick = () => {
    const a = +$('#ip-a').value;
    if (!(a > 0) || a > bal + 0.5) { $('#ip-err').textContent = `Enter an amount between 1 and ${money(bal)}.`; return; }
    const method = $('#ip-m').value;
    const pay = { id: uid('pay'), no: 'PAY-' + String(S.payments.length + 1).padStart(4, '0'), invId: i.id, cid: i.cid,
      amount: a, date: $('#ip-d').value || iso(TODAY), method, ref: $('#ip-r').value.trim(), cheque: $('#ip-chq').value.trim(),
      bank: $('#ip-bank').value.trim(), notes: $('#ip-n').value.trim(), file: PAY_FILE, by: 'Aarav Mehta', ts: Date.now() };
    const rc = { id: uid('rc'), no: nextNo('rcpt'), payId: pay.id, invId: i.id, cid: i.cid, amount: a, date: pay.date, method, ref: pay.ref || pay.cheque };
    pay.rcpt = rc.no;
    S.payments.push(pay); S.receipts.push(rc);
    syncInvoice(i);
    logAudit('invoice', i.id, `Payment ${money(a)} recorded`, `${method}${pay.ref ? ' · ' + pay.ref : ''} · receipt ${rc.no}`);
    logAudit('invoice', i.id, `Status changed to ${INV_LABEL[invStatus(i)]}`, '');
    PAY_FILE = '';
    closeModal();
    toast('Payment recorded', `${money(a)} against ${i.no} · receipt ${rc.no}`);
    A.rcptView({ dataset: { id: pay.id } });
    rerender();
  };
};

A.invAttach = el => {

    <div class="field"><label for="ia-k">Document type</label><select class="select" id="ia-k">${['Customer PO', 'Work order', 'Delivery challan', 'Inspection report', 'Signed quotation', 'Supporting document'].map(k => `<option>${k}</option>`).join('')}</select></div>

function statementRows(cid) {
  const rows = [];
  S.invoices.filter(i => i.cid === cid && i.status !== 'draft' && i.status !== 'void').forEach(i => rows.push({ date: i.date, doc: i.no, type: 'invoice', id: i.id, debit: i.amount, credit: 0, label: 'Invoice' }));
  S.payments.filter(p => p.cid === cid).forEach(p => rows.push({ date: p.date, doc: p.rcpt || p.no, type: 'payment', id: p.id, debit: 0, credit: p.amount, label: `Payment · ${p.method}` }));
  S.cnotes.filter(n => n.cid === cid).forEach(n => rows.push({ date: n.date, doc: n.no, type: 'cn', id: n.id, debit: 0, credit: n.total, label: `Credit note · ${n.reason}` }));
  S.dnotes.filter(n => n.cid === cid).forEach(n => rows.push({ date: n.date, doc: n.no, type: 'dn', id: n.id, debit: n.total, credit: 0, label: 'Debit note' }));
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.type === 'invoice' ? -1 : 1);
  let bal = 0;
  rows.forEach(r => { bal += r.debit - r.credit; r.bal = Math.round(bal * 100) / 100; });
  return rows;
}
function custFinance(cid) {
  const inv = S.invoices.filter(i => i.cid === cid && !['draft', 'void'].includes(i.status));
  const invoiced = inv.reduce((s, i) => s + i.amount, 0);
  const paid = S.payments.filter(p => p.cid === cid).reduce((s, p) => s + p.amount, 0);
  const credits = S.cnotes.filter(n => n.cid === cid).reduce((s, n) => s + n.total, 0);
  const debits = S.dnotes.filter(n => n.cid === cid).reduce((s, n) => s + n.total, 0);
  const outstanding = Math.max(0, Math.round((invoiced + debits - paid - credits) * 100) / 100);
  const overdue = inv.filter(i => invBal(i) > 0 && i.due < iso(TODAY)).reduce((s, i) => s + invBal(i), 0);
  const c = cust(cid);
  const limit = c.creditLimit || 0;
  const available = limit ? Math.max(0, limit - outstanding) : 0;
  const status = !limit ? 'No limit set' : outstanding > limit ? 'Over limit' : outstanding > limit * 0.8 ? 'Near limit' : 'Within limit';
  return { invoiced, paid, credits, debits, outstanding, overdue, limit, available, status, count: inv.length };
}

const PDF_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
let PDF_LOADING = null;
function ensurePdfLib() {
  if (window.html2pdf) return Promise.resolve(true);
  if (PDF_LOADING) return PDF_LOADING;
  PDF_LOADING = new Promise(res => {
    const s = document.createElement('script');
    s.src = PDF_LIB; s.onload = () => res(!!window.html2pdf); s.onerror = () => { PDF_LOADING = null; res(false); };
    document.head.appendChild(s);
  });
  return PDF_LOADING;
}
/* hands the file to the viewer: the artifact download capability when the page runs inside claude.ai, a normal browser download otherwise */
async function saveFile(filename, blob) {
  try {
    const d = window.claude && typeof claude.use === 'function' ? await claude.use('downloads') : null;
    if (d) { await d.save({ filename, data: blob }); return 'saved'; }
  } catch (e) { return e && e.code === 'declined' ? 'declined' : 'failed'; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'saved';
  } catch (e) { return 'failed'; }
}
function pdfStage(html) {
  const w = document.createElement('div');
  w.className = 'pdf-stage'; w.innerHTML = html;
  document.body.appendChild(w);
  return w;
}
/* builds the A4 PDF from the same markup the screen shows */
async function downloadPdf(html, filename, label) {
  const t = toast('Preparing PDF', `${filename} · building the A4 layout`);
  const ok = await ensurePdfLib();
  if (!ok) {
    toast('PDF library could not load', 'Opening the print dialog instead — choose “Save as PDF” there.', 'warn');
    printHTML(html);
    return false;
  }
  const stage = pdfStage(html);
  stage.classList.add('capturing');   // html2canvas measures the live box, so it has to sit at 0,0 while we shoot it
  try {
    const node = stage.firstElementChild;
    node.classList.add('pdf-export');  // the library clones this node out of the stage, so the export styles ride on the node itself
    const blob = await html2pdf().set({
      margin: [8, 8, 10, 8], filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, scrollX: 0, scrollY: 0, windowWidth: document.documentElement.clientWidth },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(node).outputPdf('blob');
    const res = await saveFile(filename, blob);
    if (res === 'saved') toast('PDF downloaded', `${filename}${label ? ' · ' + label : ''}`);
    else if (res === 'declined') toast('Download cancelled', '', 'warn');
    else { toast('Could not save the file', 'Opening the print dialog instead.', 'warn'); printHTML(html); }
    return res === 'saved';
  } catch (e) {
    toast('PDF build failed', 'Opening the print dialog instead — choose “Save as PDF” there.', 'warn');
    printHTML(html);
    return false;
  } finally { stage.remove(); }
}
/* print just this document, whatever page we are on */
function printHTML(html) {
  const old = $('#print-stage'); if (old) old.remove();
  const w = document.createElement('div');
  w.id = 'print-stage'; w.className = 'pdf-stage print-only print-target'; w.innerHTML = html;
  document.body.appendChild(w);
  setTimeout(() => { window.print(); setTimeout(() => w.remove(), 1000); }, 120);
}
const docFile = (no, kind) => `${String(no).replace(/[^\w-]+/g, '-')}-${kind}.pdf`;

/* ---------- WhatsApp ---------- */
const waDigits = p => String(p || '').replace(/\D/g, '').replace(/^0+/, '');
function waUrl(phone, msg) {
  const d = waDigits(phone);
  const n = d.length === 10 ? '91' + d : d;              // plain Indian mobile numbers get the country code
  return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
}
/* opens WhatsApp (app or web) with the message already typed in */
function openWhatsApp(phone, msg) {
  const url = waUrl(phone, msg);
  const w = window.open(url, '_blank', 'noopener');
  if (!w) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  return url;
}
function openMail(to, subject, body, cc, bcc) {
  const q = [['subject', subject], ['body', body], ['cc', (cc || []).join(',')], ['bcc', (bcc || []).join(',')]]
    .filter(([, v]) => v).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const url = `mailto:${encodeURIComponent(to || '')}${q ? '?' + q : ''}`;
  window.location.href = url;
  return url;
}
